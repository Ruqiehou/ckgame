<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CK 引擎 · 可操作地图</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">CK Map</div>
      <div id="date" class="date">—</div>
      <div id="player-summary" class="player-summary">—</div>
      <div class="time-controls">
        <button data-days="1">+1天</button>
        <button data-days="7">+1周</button>
        <button data-days="30">+1月</button>
        <button data-days="90">+1季</button>
        <button data-days="365">+1年</button>
      </div>
    </header>

    <main class="layout">
      <section class="map-panel">
        <svg id="map" viewBox="0 0 820 720" role="img" aria-label="游戏地图"></svg>
        <div class="map-hint">💡 点击省份查看详情 · 选中军团后点击省份可下令行军 · 右键取消选择</div>
      </section>

      <aside class="side">
        <!-- 标签页导航 -->
        <nav class="tabs" id="tab-nav">
          <button class="tab active" data-tab="player">玩家</button>
          <button class="tab" data-tab="county">省份</button>
          <button class="tab" data-tab="diplomacy">外交</button>
          <button class="tab" data-tab="schemes">阴谋</button>
          <button class="tab" data-tab="council">内阁</button>
          <button class="tab" data-tab="war">战争</button>
          <button class="tab" data-tab="save">存档</button>
        </nav>

        <!-- 玩家面板 -->
        <div class="tab-content active" id="tab-player">
          <section class="card">
            <h2>玩家</h2>
            <select id="player-select"></select>
            <div id="player-detail" class="detail"></div>
            <div class="btn-row">
              <button id="btn-raise">征召军团</button>
              <button id="btn-feast">宴会 (20金)</button>
              <button id="btn-disband">解散军团</button>
            </div>
          </section>

          <section class="card">
            <h2>法律</h2>
            <div id="laws" class="detail"></div>
          </section>

          <section class="card">
            <h2>军团详情</h2>
            <div id="army-detail" class="detail">未选择军团</div>
            <div class="btn-row">
              <button id="btn-recruit-knights">招募精锐 (25金)</button>
            </div>
            <div class="btn-row">
              <select id="commander-select"></select>
              <button id="btn-set-commander">任命指挥官</button>
            </div>
          </section>

          <section class="card cheat-card">
            <h2>作弊模式</h2>
            <div id="cheat-status" class="detail">未开启</div>
            <div class="btn-row">
              <button id="btn-toggle-cheat">开启/关闭作弊</button>
              <button id="btn-toggle-infinite-gold">开启/关闭无限金钱</button>
            </div>
            <div class="btn-row">
              <button id="btn-cheat-gold">+1000 金</button>
              <button id="btn-cheat-scheme">瞬间完成阴谋</button>
            </div>
          </section>
        </div>

        <!-- 省份面板 -->
        <div class="tab-content" id="tab-county">
          <section class="card">
            <h2>选中省份</h2>
            <div id="county-detail" class="detail">点击地图选择省份</div>
            <div class="btn-row">
              <button id="btn-move">行军至此</button>
              <button id="btn-war">对领主宣战</button>
              <button id="btn-improve">改善关系 (10金)</button>
              <button id="btn-develop">发展 (+1, 10金)</button>
              <button id="btn-fabricate">伪造宣称 (50金)</button>
            </div>
            <div class="btn-row" style="margin-top:6px">
              <select id="building-type-select">
                <option value="">选择建筑类型...</option>
                <option value="FARM">农田 (增加税收)</option>
                <option value="BARRACKS">兵营 (增加征兵)</option>
                <option value="WALLS">城墙 (增加防御)</option>
                <option value="MARKET">市场 (增加贸易)</option>
                <option value="CHURCH">教堂 (增加稳定)</option>
                <option value="WATCH_TOWER">瞭望塔 (增加视野)</option>
                <option value="STABLE">马厩 (提升骑兵)</option>
                <option value="WORKSHOP">工坊 (提升生产)</option>
              </select>
              <button id="btn-build">建造/升级建筑</button>
            </div>
          </section>
          <section class="card">
            <h2>建筑</h2>
            <div id="county-buildings" class="detail">选择省份查看建筑</div>
          </section>
          <section class="card">
            <h2>宣称</h2>
            <div id="claims" class="list"></div>
          </section>
        </div>

        <!-- 外交面板 -->
        <div class="tab-content" id="tab-diplomacy">
          <section class="card">
            <h2>角色列表</h2>
            <div id="character-list" class="list"></div>
          </section>
          <section class="card">
            <h2>选择角色</h2>
            <select id="dipl-char-select"></select>
            <div id="dipl-char-detail" class="detail">选择一位角色</div>
          </section>
          <section class="card">
            <h2>外交操作</h2>
            <div class="btn-row">
              <button id="btn-alliance">缔结同盟</button>
              <button id="btn-non-aggression">互不侵犯</button>
              <button id="btn-marry">求婚</button>
            </div>
            <div class="btn-row">
              <button id="btn-vassalage">成为附庸</button>
              <button id="btn-trade">贸易协定</button>
              <button id="btn-intel">情报共享</button>
            </div>
            <div class="btn-row">
              <input id="gift-amount" type="number" value="50" min="1" max="500" style="width:70px" />
              <button id="btn-gift">送礼</button>
              <button id="btn-rival">设为宿敌</button>
            </div>
            <div class="btn-row">
              <button id="btn-invite">邀请访问 (30金)</button>
              <button id="btn-feast">举办宴会 (40金)</button>
              <button id="btn-duel">决斗</button>
            </div>
          </section>
          <section class="card">
            <h2>条约与关系</h2>
            <div id="treaties" class="list"></div>
          </section>
        </div>

        <!-- 阴谋面板 -->
        <div class="tab-content" id="tab-schemes">
          <section class="card">
            <h2>发起阴谋</h2>
            <select id="scheme-target-select"></select>
            <select id="scheme-type-select"></select>
            <div class="btn-row">
              <button id="btn-start-scheme">开始策划</button>
            </div>
          </section>
          <section class="card">
            <h2>进行中阴谋</h2>
            <div id="scheme-list" class="list"></div>
          </section>
        </div>

        <!-- 内阁面板 -->
        <div class="tab-content" id="tab-council">
          <section class="card">
            <h2>内阁成员</h2>
            <div id="council-list" class="detail"></div>
          </section>
        </div>

        <!-- 战争面板 -->
        <div class="tab-content" id="tab-war">
          <section class="card">
            <h2>战争</h2>
            <div id="wars" class="list"></div>
          </section>
          <section class="card">
            <h2>针对你的派系</h2>
            <div id="factions" class="list"></div>
          </section>
        </div>

        <!-- 存档面板 -->
        <div class="tab-content" id="tab-save">
          <section class="card">
            <h2>存档管理器</h2>
            <div class="save-row">
              <input id="save-name" placeholder="存档名" maxlength="48" />
              <button id="btn-save">保存</button>
            </div>
            <div id="saves" class="list saves"></div>
            <div class="btn-row">
              <button id="btn-load">读取选中</button>
              <button id="btn-delete-save">删除选中</button>
              <button id="btn-new">新局</button>
            </div>
          </section>
        </div>

        <!-- 剧情线 -->
        <section class="card">
          <h2>剧情线</h2>
          <div id="storylines" class="list"></div>
        </section>
        <!-- 教程 -->
        <section class="card" id="tutorial-card">
          <h2>🎓 新手教程</h2>
          <div id="tutorial-box">
            <div id="tutorial-title" style="font-weight:bold;color:var(--accent);margin-bottom:4px"></div>
            <div id="tutorial-desc" style="font-size:13px;color:#cfd6e4;margin-bottom:6px"></div>
            <div id="tutorial-hint" class="muted" style="font-size:12px"></div>
            <div class="btn-row" style="margin-top:8px">
              <button id="btn-tutorial-next">下一步</button>
              <button id="btn-tutorial-skip">跳过教程</button>
            </div>
          </div>
        </section>
        <!-- 日志（始终显示） -->
        <section class="card log-card">
          <h2>指令 / 日志</h2>
          <div id="messages" class="list msg"></div>
          <div id="log" class="list log"></div>
        </section>
      </aside>
    </main>
  </div>
  <div id="event-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:1000;">
    <div style="background:linear-gradient(135deg,#1a1f2e 0%,#12161f 100%);border:2px solid var(--accent);border-radius:12px;max-width:560px;width:94%;padding:24px;color:var(--text);box-shadow:0 8px 32px rgba(0,0,0,.5);">
      <h3 id="event-title" style="margin:0 0 12px;font-size:18px;color:var(--accent);text-align:center;text-shadow:0 0 10px rgba(100,140,255,.3);"></h3>
      <p id="event-desc" style="margin:0 0 20px;font-size:14px;color:#cfd6e4;line-height:1.6;text-align:center;"></p>
      <div id="event-choices" style="display:flex;flex-direction:column;gap:10px;"></div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
